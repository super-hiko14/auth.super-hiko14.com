<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本人確認 — 新 高級ジェネ™</title>
<meta name="description" content="新 高級ジェネ™ Discordサーバーの認証 — 本人確認ステップです。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#dcede1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/auth.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<main class="page">
  <div class="card">
    <img class="me" src="/assets/eee.png" alt="" width="28" height="31">
    <p class="eyebrow">STEP 2 / 2</p>
    <h1>本人確認</h1>

    <p class="alert" id="retry-msg" role="alert" hidden>確認に失敗しました。もう一度お試しください。</p>

    <p class="lead">Discord認証が完了しました。</p>
    <p class="lead">ボットによる自動アクセスを防ぐため、下のチェックを完了してください。</p>

    <div class="turnstile">
      <div class="cf-turnstile"
           data-sitekey="0x4AAAAAACpjOymTxGd8Ou_o"
           data-callback="onTurnstileSuccess"
           data-theme="light"
           data-language="ja">
      </div>
    </div>

    <p class="note">
      確認を完了することで、<a href="https://super-hiko14.com/terms/kokyujene/" target="_blank" rel="noopener">利用規約</a>および<a href="https://super-hiko14.com/privacypolicy/kokyujene/" target="_blank" rel="noopener">プライバシーポリシー</a>に同意したものとみなされます。
    </p>
  </div>
</main>

<footer class="foot">
  <span>&copy; 2026 Super Hiko14</span>
  <a href="https://super-hiko14.com/terms/kokyujene/">利用規約</a>
  <a href="https://super-hiko14.com/privacypolicy/kokyujene/">プライバシーポリシー</a>
</footer>

<script>
function onTurnstileSuccess(token) {
  window.location.href = '/api/verify?ts=' + encodeURIComponent(token);
}
if (new URLSearchParams(location.search).get('retry')) {
  document.getElementById('retry-msg').hidden = false;
}
</script>
</body>
</html>
