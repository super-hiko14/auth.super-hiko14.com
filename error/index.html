<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>認証エラー — 新 高級ジェネ™</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#dcede1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="page">
  <div class="card is-error">
    <img class="me" src="/assets/eee.png" alt="" width="28" height="31">
    <p class="eyebrow">auth.super-hiko14.com</p>
    <h1 id="error-title">認証に失敗しました</h1>
    <p class="lead" id="error-detail">予期しないエラーが発生しました。時間をおいて再度お試しください。</p>

    <p class="action"><a class="chip" href="/">もう一度試す</a></p>

    <p class="note">
      解決しない場合は <a href="https://discord.super-hiko14.com" target="_blank" rel="noopener">Super Hiko14</a> へ直接ご連絡ください(Discord ID：<code>super_hiko14</code>)。<br>
      Safari のプライベートリレーは VPN 扱いになります。
    </p>
  </div>
</main>

<footer class="foot">
  <span>&copy; 2026 Super Hiko14</span>
  <a href="https://super-hiko14.com/terms/kokyujene/">利用規約</a>
  <a href="https://super-hiko14.com/privacypolicy/kokyujene/">プライバシーポリシー</a>
</footer>

<script>
(function () {
  var ERRORS = {
    vpn:       { title: 'VPN / プロキシ検出',      detail: 'VPN、プロキシ、またはデータセンター回線が検出されました。VPNをオフにしてから再度お試しください。' },
    bot:       { title: '自動アクセスを検出',      detail: 'Cloudflare Turnstile によるボット判定が失敗しました。正規のブラウザから再度お試しください。' },
    age:       { title: 'アカウントが新しすぎます', detail: 'Discordアカウント作成から14日未満のため認証できません。しばらく経ってから再度お試しください。' },
    duplicate: { title: '重複が検出されました',     detail: 'このIPアドレスでは既に別のアカウントが認証済みです。サブアカウントの疑いがあるためブロックされました。' },
    invalid:   { title: 'セッションエラー',        detail: '認証セッションが無効または期限切れです。最初からやり直してください。' },
    guild:     { title: 'サーバー未参加',          detail: '先にDiscordサーバーに参加してから認証してください。' },
    unknown:   { title: '認証に失敗しました',      detail: '予期しないエラーが発生しました。時間をおいて再度お試しください。' }
  };
  var type = new URLSearchParams(location.search).get('type') || 'unknown';
  var msg = Object.prototype.hasOwnProperty.call(ERRORS, type) ? ERRORS[type] : ERRORS.unknown;
  document.getElementById('error-title').textContent = msg.title;
  document.getElementById('error-detail').textContent = msg.detail;
})();
</script>
</body>
</html>
